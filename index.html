<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공항 자료 검색</title>
  <style>
    :root{--ink:#1c2b40;--muted:#64748b;--line:#dce3ed;--blue:#1f5eff;--surface:#fff;--bg:#f3f6fb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6}
    .wrap{max-width:1440px;margin:0 auto;padding:40px 28px 60px}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--blue);font-weight:750}h1{font-size:30px;letter-spacing:-.05em;margin:4px 0}header p{color:var(--muted);margin:4px 0 24px}
    .searchbox{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 22px #162b4a06}form{display:flex;align-items:end;gap:12px}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.inputwrap{flex:1}input{width:100%;height:50px;border:1px solid #becbdc;border-radius:9px;padding:0 16px;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:#fff}input:focus{outline:3px solid #1f5eff25;border-color:var(--blue)}button,select{font:inherit}button{min-height:44px;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 16px;background:#fff;color:var(--ink);font-weight:650}button:hover{background:#edf3ff}button:disabled{opacity:.45;cursor:default}.primary{height:50px;background:var(--blue);color:#fff;border-color:var(--blue);min-width:105px}.primary:hover{background:#184fde}.refresh{height:50px}.examples{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;align-items:center}.examples span{font-size:12px;color:var(--muted);margin-right:3px}.examples button{min-height:30px;padding:2px 10px;font-size:12px;background:#f5f7fc}
    #message{min-height:26px;margin-top:9px;color:var(--muted);font-size:13px}#message.error{color:#b3261e}.results{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;margin-top:24px;align-items:start}.panel{border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden}.panelhead{padding:19px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.heading{display:flex;align-items:center;gap:10px}.icon{width:34px;height:34px;border-radius:9px;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-weight:750}.green{background:#eaf8f1;color:#12835a}h2{font-size:18px;margin:0}.count{display:inline-block;color:var(--muted);font-size:12px;margin-left:6px}select{border:1px solid var(--line);border-radius:7px;padding:6px;max-width:130px;background:#fff;color:var(--ink)}.panelmeta{font-size:12px;padding:10px 20px;color:var(--muted);background:#fafbfd;white-space:pre-line}.content{padding:0 20px}.empty{padding:40px 10px;text-align:center;color:var(--muted)}.errorbox{padding:22px 0;color:#b3261e;white-space:pre-wrap}.errorbox button{margin-top:12px;display:block}.record{padding:20px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record h3{font-size:16px;line-height:1.4;margin:0 0 9px;overflow-wrap:anywhere}.recordmeta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.badge{padding:2px 8px;border-radius:5px;background:#eef3fb;color:#37557d;font-weight:650}.mention{background:#fff4dd;color:#906311}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px}.field{margin:12px 0}.fieldlabel{font-size:12px;font-weight:750;color:var(--muted);margin-bottom:4px}.field .text{margin:0}a{color:var(--blue);text-decoration:none;overflow-wrap:anywhere}a:hover{text-decoration:underline}.sourcelink{font-size:12px;display:inline-block;margin-top:10px}details{background:#f6f8fc;border:1px solid #e6ebf2;border-radius:8px;margin-top:14px;padding:10px 12px}summary{cursor:pointer;color:#48617f;font-size:13px;font-weight:650}.warning{color:#8a5c00;background:#fff9e8;padding:10px 12px;border-radius:8px;margin:12px 0;font-size:13px;white-space:pre-wrap}.pager{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);font-size:13px}.pager[hidden]{display:none}.pager button{min-height:36px;padding:6px 12px}.footer{font-size:12px;color:var(--muted);margin-top:20px}.loading{padding:40px 10px;color:var(--muted);text-align:center}.loading:before{content:'';display:inline-block;width:14px;height:14px;border:2px solid #dce4f4;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:850px){.results{grid-template-columns:1fr}.wrap{padding:24px 16px 40px}}
    @media(max-width:500px){h1{font-size:26px}.searchbox{padding:16px}form{flex-wrap:wrap;gap:8px}.inputwrap{flex-basis:100%}.primary{flex:1}.refresh{flex:1}.panelhead,.panelmeta,.pager{padding-left:16px;padding-right:16px}.content{padding:0 16px}h2{font-size:16px}}
    @media(prefers-reduced-motion:reduce){.loading:before{animation:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="eyebrow">FLIGHT OPERATIONS / AIRPORT SOURCES</div><h1>공항 자료 검색</h1><p>공항코드 하나로 지도 참고자료와 운항기록을 함께 확인하세요.</p></header>
    <section class="searchbox" aria-label="공항 검색">
      <form id="searchForm"><div class="inputwrap"><label for="code">ICAO 공항코드</label><input id="code" placeholder="예: KBFI" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" required aria-describedby="message"></div><button class="primary" type="submit">검색</button><button class="refresh" id="refresh" type="button" disabled>원본 새로고침</button></form>
      <div class="examples"><span>빠른 검색</span><button type="button" data-code="RKSS">RKSS</button><button type="button" data-code="KBFI">KBFI</button><button type="button" data-code="KEWR">KEWR</button><button type="button" data-code="RJTT">RJTT</button></div>
      <div id="message" role="status" aria-live="polite">ICAO 공항코드 4자리를 입력하세요.</div>
    </section>
    <div class="results">
      <section class="panel" id="mapPanel" aria-label="Google My Maps 검색 결과"><div class="panelhead"><div class="heading"><span class="icon" aria-hidden="true">M</span><h2>Google My Maps <span class="count" id="mapCount"></span></h2></div></div><div class="panelmeta" id="mapMeta">지도에 저장된 공항 참고자료</div><div class="content" id="mapContent" aria-live="polite"><div class="empty">검색하면 지도 자료가 표시됩니다.</div></div><div class="pager" id="mapPager" hidden></div></section>
      <section class="panel" id="sheetPanel" aria-label="운항기록 검색 결과"><div class="panelhead"><div class="heading"><span class="icon green" aria-hidden="true">F</span><h2>운항기록 <span class="count" id="sheetCount"></span></h2></div><select id="aircraft" aria-label="기종 시트 선택"><option value="">전체 시트</option><option value="ACJ">ACJ</option><option value="G650">G650</option></select></div><div class="panelmeta" id="sheetMeta">운항 메모 · 최신 기록순</div><div class="content" id="sheetContent" aria-live="polite"><div class="empty">검색하면 운항기록이 표시됩니다.</div></div><div class="pager" id="sheetPager" hidden></div></section>
    </div>
    <div class="footer">저장된 원문 자료입니다. 조회 시각은 원본 내용의 작성·갱신 시각과 다를 수 있습니다.</div>
  </main>
  <script>
    'use strict';
    // 보내주신 Apps Script 웹 앱 URL을 반영했습니다.
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwgrAuJL4eMVjBsaEKshEaycDEhRJjJvqli_tJwoUM0_9T4uFmodbOV5aqV6UyPKpZx/exec';
    // Apps Script의 중첩 iframe에서 보내는 ready 응답의 source Window를 저장합니다.
    // GitHub 페이지에서 google.script.run을 직접 호출하지 않습니다.
    const transport = (() => {
      let frame = null, remote = null, remoteOrigin = '', channel = '', connecting = null, sequence = 0;
      const pending = new Map();
      function connect() {
        if (remote) return Promise.resolve();
        if (connecting) return connecting;
        if (!/^https:\/\//.test(location.origin)) return Promise.reject(new Error('HTTPS GitHub Pages 주소에서 실행하세요.'));
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        channel = Array.from(bytes, x => x.toString(16).padStart(2, '0')).join('');
        connecting = new Promise((resolve, reject) => {
          let handshakeTimer;
          const receive = event => {
            const data = event.data;
            if (!data || data.app !== 'airport-sources' || data.channel !== channel) return;
            if (!/^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/.test(event.origin) && event.origin !== 'https://script.google.com') return;
            if (data.type === 'ready' && !remote && event.source) {
              remote = event.source; remoteOrigin = event.origin; clearTimeout(handshakeTimer); resolve(); return;
            }
            if (event.source !== remote || event.origin !== remoteOrigin || data.type !== 'result') return;
            const entry = pending.get(data.id); if (!entry) return;
            clearTimeout(entry.timer); pending.delete(data.id);
            if (data.ok) entry.resolve(data.result); else entry.reject(new Error(data.error || '백엔드 조회 실패'));
          };
          window.addEventListener('message', receive);
          handshakeTimer = setTimeout(() => {
            window.removeEventListener('message', receive); if (frame) frame.remove(); frame = null; connecting = null;
            reject(new Error('백엔드 연결 실패: Apps Script 새 버전 배포, 접속 권한, ALLOWED_FRONTEND_ORIGINS를 확인하세요. 로그인 필요 시 백엔드 URL을 별도 탭에서 먼저 여세요.'));
          }, 30000);
          const url = new URL(BACKEND_URL); url.searchParams.set('clientOrigin', location.origin); url.searchParams.set('channel', channel);
          frame = document.createElement('iframe'); frame.title = '공항검색 백엔드 연결'; frame.setAttribute('aria-hidden', 'true');
          frame.style.cssText = 'position:absolute;width:1px;height:1px;left:-10000px;border:0;'; frame.src = url.href; document.body.append(frame);
        });
        return connecting;
      }
      async function search(request) {
        await connect();
        const id = 'req-' + (++sequence);
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(new Error('조회 시간이 초과되었습니다. 다시 검색하세요.')); }, 190000);
          pending.set(id, { resolve, reject, timer });
          try { remote.postMessage({ app: 'airport-sources', channel, type: 'search', id, request }, remoteOrigin); }
          catch (error) { clearTimeout(timer); pending.delete(id); reject(error); }
        });
      }
      return { search };
    })();
    const state = { code: '', generation: 0, map: { serial: 0 }, sheet: { serial: 0 } };
    const $ = id => document.getElementById(id);
    function el(tag, className, text) { const n = document.createElement(tag); if (className) n.className = className; if (text !== undefined) n.textContent = text; return n; }
    function sourceLink(url, title) {
      const a = el('a', 'sourcelink', title);
      try { const u = new URL(url); if (u.protocol === 'https:' && ['docs.google.com', 'www.google.com'].includes(u.hostname)) a.href = u.href; } catch (e) { /* 잘못된 주소는 링크로 만들지 않음 */ }
      a.target = '_blank'; a.rel = 'noopener noreferrer'; return a;
    }
    function field(parent, label, text) { const n = el('div', 'field'); n.append(el('div', 'fieldlabel', label), el('div', 'text', text)); parent.append(n); }
    function kst(value) { return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(value)) + ' KST'; }
    function submit(refresh) {
      const code = $('code').value.normalize('NFKC').trim().toUpperCase();
      if (!/^[A-Z]{4}$/.test(code)) { $('message').textContent = 'ICAO 공항코드 4자리를 입력하세요. 예: RKSS'; $('message').className = 'error'; $('code').focus(); return; }
      state.code = code; state.generation++; $('code').value = code; $('refresh').disabled = false;
      $('message').className = ''; $('message').textContent = code + ' · 두 소스의 자료를 조회합니다.';
      load('map', 1, refresh); load('sheet', 1, refresh);
    }
    function load(source, page, refresh) {
      const generation = state.generation, serial = ++state[source].serial;
      const valid = () => generation === state.generation && serial === state[source].serial;
      const content = $(source + 'Content'); content.replaceChildren(el('div', 'loading', '자료를 불러오는 중입니다…'));
      $(source + 'Panel').setAttribute('aria-busy', 'true'); $(source + 'Count').textContent = ''; $(source + 'Pager').hidden = true;
      $(source + 'Meta').textContent = state.code + ' · 조회 중';
      const request = { source, code: state.code, page, refresh: !!refresh, aircraft: source === 'sheet' ? $('aircraft').value : '' };
      transport.search(request).then(result => { if (valid()) render(source, result); })
        .catch(error => {
          if (!valid()) return;
          $(source + 'Panel').setAttribute('aria-busy', 'false');
          $(source + 'Meta').textContent = state.code + ' · 조회 실패';
          const box = el('div', 'errorbox', error.message || '자료를 불러오지 못했습니다.');
          const retry = el('button', '', '다시 시도'); retry.type = 'button'; retry.addEventListener('click', () => load(source, page, true)); box.append(retry); content.replaceChildren(box);
        });
    }
    function render(source, data) {
      $(source + 'Panel').setAttribute('aria-busy', 'false'); $(source + 'Count').textContent = data.total + '건';
      $(source + 'Meta').textContent = data.code + ' · 조회 ' + kst(data.fetchedAt) + (data.cached ? ' · 5분 이내 캐시' : ' · 원본 조회');
      const content = $(source + 'Content'); content.replaceChildren();
      if (data.warnings && data.warnings.length) content.append(el('div', 'warning', data.warnings.join('\n')));
      if (!data.records.length) content.append(el('div', 'empty', '해당 공항의 자료가 없습니다.'));
      data.records.forEach(record => {
        const article = el('article', 'record');
        if (source === 'map') {
          article.append(el('h3', '', record.title));
          if (record.matchType === 'mention') { const meta = el('div', 'recordmeta'); meta.append(el('span', 'badge mention', '메모에 공항코드 포함')); article.append(meta); }
          if (record.description) article.append(el('div', 'text', record.description));
          (record.fields || []).forEach(f => { if (!(f.label.toLowerCase() === 'description' && f.value === record.description)) field(article, f.label, f.value); });
          if (!record.description && !(record.fields || []).length) article.append(el('div', 'text', '저장된 설명이 없습니다.'));
          if (record.coordinates) field(article, '좌표', record.coordinates.lat + ', ' + record.coordinates.lng);
          article.append(sourceLink(record.url, 'Google My Maps 원본 열기 ↗'));
        } else {
          article.append(el('h3', '', (record.date || '날짜 정보 없음') + ' · ' + record.aircraft));
          const meta = el('div', 'recordmeta'); meta.append(el('span', 'badge', record.sheetName), el('span', '', record.title), el('span', '', record.rowNumber + '행')); article.append(meta);
          if (record.memo) article.append(el('div', 'text', record.memo));
          else article.append(el('div', 'text', '저장된 운항 메모가 없습니다. 전체 행에서 기록을 확인하세요.'));
          const details = el('details'); details.append(el('summary', '', '운항 메모 외 행 데이터 보기 (' + record.fields.length + '개 항목)'));
          record.fields.forEach(f => field(details, f.label, f.value)); article.append(details, sourceLink(record.url, '운항기록 원본 행 열기 ↗'));
        }
        content.append(article);
      });
      const pager = $(source + 'Pager'); pager.replaceChildren(); pager.hidden = data.pages <= 1;
      if (data.pages > 1) {
        const previous = el('button', '', '이전'); previous.type = 'button'; previous.disabled = data.page <= 1; previous.onclick = () => load(source, data.page - 1, false);
        const next = el('button', '', '다음'); next.type = 'button'; next.disabled = data.page >= data.pages; next.onclick = () => load(source, data.page + 1, false);
        pager.append(previous, el('span', '', data.page + ' / ' + data.pages), next);
      }
    }
    $('searchForm').addEventListener('submit', e => { e.preventDefault(); submit(false); });
    $('refresh').addEventListener('click', () => submit(true));
    $('aircraft').addEventListener('change', () => { if (state.code) load('sheet', 1, false); });
    document.querySelectorAll('[data-code]').forEach(button => button.addEventListener('click', () => { $('code').value = button.dataset.code; submit(false); }));
  </script>
</body>
</html>
