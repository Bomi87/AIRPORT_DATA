<body>
  <main class="wrap">
    <header><div class="eyebrow">FLIGHT OPERATIONS / AIRPORT SOURCES</div><h1>Airport Data Search</h1></header>
    <section class="searchbox" aria-label="공항 검색">
      <form id="searchForm"><div class="inputwrap"><label for="code">ICAO 공항코드</label><input id="code" placeholder="예: KBFI" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" required aria-describedby="message"></div><button class="primary" type="submit">조회</button><button class="refresh" id="refresh" type="button" disabled>원본 새로고침</button></form>
      <div class="examples"><span>빠른 검색</span><button type="button" data-code="RKSS">RKSS</button><button type="button" data-code="KBFI">KBFI</button><button type="button" data-code="KEWR">KEWR</button><button type="button" data-code="RJTT">RJTT</button></div>
      <div id="message" role="status" aria-live="polite"></div>
    </section>
    <section class="airport-map-card" aria-label="공항 지도">
      <div class="map-toolbar"><h2>공항 지도</h2><div class="map-toolbar-actions"><span id="selectedAirport" class="selected-airport"></span><button id="mapReload" type="button" aria-label="공항 지도 다시 불러오기">↻</button></div></div>
      <div id="airportMap" aria-label="공항 마커를 클릭하면 자료를 조회합니다"></div>
      <div id="mapStatus" class="map-status" role="status">공항 위치를 불러오는 중입니다…</div>
    </section>
    <div class="results" id="results" hidden>
      <section class="panel" id="mapPanel" aria-label="공항정보 검색 결과"><div class="panelhead"><div class="heading"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></svg></span><h2>공항정보 <span class="count" id="mapCount"></span></h2></div></div><div class="panelmeta" id="mapMeta">지도에 저장된 공항 참고자료</div><div class="content" id="mapContent" aria-live="polite"><div class="empty">검색하면 지도 자료가 표시됩니다.</div></div><div class="pager" id="mapPager" hidden></div></section>
      <section class="panel" id="sheetPanel" aria-label="운항기록 검색 결과"><div class="panelhead"><div class="heading"><span class="icon green" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 11 7 1 7-8 3 1-5 9 4 5-2 1-5-3-4 3-2-1 2-5-5-1z"/></svg></span><h2>운항기록 <span class="count" id="sheetCount"></span></h2></div><select id="aircraft" aria-label="기종 시트 선택"><option value="">전체 시트</option><option value="ACJ">ACJ</option><option value="G650">G650</option></select></div><div class="panelmeta" id="sheetMeta">운항 메모 · 최신 기록순</div><div class="content" id="sheetContent" aria-live="polite"><div class="empty">검색하면 운항기록이 표시됩니다.</div></div><div class="pager" id="sheetPager" hidden></div></section>
    </div>
    <div class="footer">저장된 원문 자료입니다. 조회 시각은 원본 내용의 작성·갱신 시각과 다를 수 있습니다.</div>
  </main>
  <script>
    'use strict';
    // 보내주신 Apps Script 웹 앱 URL을 반영했습니다.
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwgrAuJL4eMVjBsaEKshEaycDEhRJjJvqli_tJwoUM0_9T4uFmodbOV5aqV6UyPKpZx/exec';
    // Apps Script의 중첩 iframe에서 보내는 ready 응답의 source Window를 저장합니다.
    // GitHub 페이지에서 google.script.run을 직접 호출하지 않습니다.
    const transport = (() => {
      let frame = null, remote = null, remoteOrigin = '', channel = '', connecting = null, sequence = 0;
      const pending = new Map();
      function connect() {
        if (remote) return Promise.resolve();
        if (connecting) return connecting;
        if (!/^https:\/\//.test(location.origin)) return Promise.reject(new Error('HTTPS GitHub Pages 주소에서 실행하세요.'));
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        channel = Array.from(bytes, x => x.toString(16).padStart(2, '0')).join('');
        connecting = new Promise((resolve, reject) => {
          let handshakeTimer;
          const receive = event => {
            const data = event.data;
            if (!data || data.app !== 'airport-sources' || data.channel !== channel) return;
            if (!/^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/.test(event.origin) && event.origin !== 'https://script.google.com') return;
            if (data.type === 'ready' && !remote && event.source) {
              remote = event.source; remoteOrigin = event.origin; clearTimeout(handshakeTimer); resolve(); return;
            }
            if (event.source !== remote || event.origin !== remoteOrigin || data.type !== 'result') return;

            clearTimeout(entry.timer); pending.delete(data.id);
            if (data.ok) entry.resolve(data.result); else entry.reject(new Error(data.error || '백엔드 조회 실패'));
          };
          window.addEventListener('message', receive);
          handshakeTimer = setTimeout(() => {
            window.removeEventListener('message', receive); if (frame) frame.remove(); frame = null; connecting = null;
            reject(new Error('백엔드 연결 실패: Apps Script 새 버전 배포, 접속 권한, ALLOWED_FRONTEND_ORIGINS를 확인하세요. 로그인 필요 시 백엔드 URL을 별도 탭에서 먼저 여세요.'));
          }, 30000);
          const url = new URL(BACKEND_URL); url.searchParams.set('clientOrigin', location.origin); url.searchParams.set('channel', channel);
          frame = document.createElement('iframe'); frame.title = '공항검색 백엔드 연결'; frame.setAttribute('aria-hidden', 'true');
          frame.style.cssText = 'position:absolute;width:1px;height:1px;left:-10000px;border:0;'; frame.src = url.href; document.body.append(frame);
        });
        return connecting;
      }
      async function search(request) {
        await connect();
        const id = 'req-' + (++sequence);
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { pending.delete(id); reject(new Error('조회 시간이 초과되었습니다. 다시 검색하세요.')); }, 190000);
          pending.set(id, { resolve, reject, timer });
          try { remote.postMessage({ app: 'airport-sources', channel, type: 'search', id, request }, remoteOrigin); }
          catch (error) { clearTimeout(timer); pending.delete(id); reject(error); }
        });
      }
      return { search };
    })();
    const state = { code: '', generation: 0, map: { serial: 0 }, sheet: { serial: 0 } };
    const $ = id => document.getElementById(id);
    function el(tag, className, text) { const n = document.createElement(tag); if (className) n.className = className; if (text !== undefined) n.textContent = text; return n; }
    let airportMap = null, airportLayer = null, selectedMarker = null, airportLoadSerial = 0;
    const airportLocations = new Map();
    const airportMarkers = new Map();
    let selectedCode = '';
    function markerStyle(selected) { return { radius: selected ? 10 : 6, color: selected ? '#1d4ed8' : '#ffffff', weight: selected ? 3 : 1.8, fillColor: selected ? '#2563eb' : '#3976bc', fillOpacity: selected ? 1 : .85 }; }
    function updateMapLabels() {
      if (!airportMap) return;
      const bounds = airportMap.getBounds(), detailed = airportMap.getZoom() >= 5;
      airportMarkers.forEach((marker, code) => {
        if (detailed && code !== selectedCode && bounds.contains(marker.getLatLng())) marker.openTooltip(); else marker.closeTooltip();
      });
    }
    function addAirportMarker(location) {
      if (!airportMap || airportMarkers.has(location.code)) return;
      const label = el('span', '', location.code);
      const marker = L.circleMarker([location.lat, location.lng], markerStyle(false)).addTo(airportLayer)
        .bindTooltip(label, { permanent: true, direction: 'right', offset: [8, 0], className: 'airport-code-tooltip' });
      marker.on('click', () => { $('code').value = location.code; submit(false); $('results').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      airportMarkers.set(location.code, marker);
    }
    function focusAirport(code) {
      selectedCode = code; $('selectedAirport').textContent = code;
      if (!airportMap) return;
      if (selectedMarker) { airportMap.removeLayer(selectedMarker); selectedMarker = null; }
      airportMarkers.forEach((marker, markerCode) => marker.setStyle(markerStyle(markerCode === code)));
      const location = airportLocations.get(code);
      if (!location) return;
      const label = el('span', '', code);
      selectedMarker = L.circleMarker([location.lat, location.lng], { radius: 17, color: '#397af0', weight: 2, fillOpacity: .08, interactive: false }).addTo(airportMap)
        .bindTooltip(label, { permanent: true, direction: 'top', offset: [0, -16], className: 'airport-code-tooltip selected-code-tooltip' });
      airportMap.setView([location.lat, location.lng], 7, { animate: false });
      updateMapLabels();
    }
    // 원본 My Maps에서 받은 좌표만 저장합니다. 다른 공항 목록은 사용하지 않습니다.
    const AIRPORT_LOCATION_CACHE_KEY = 'airport-locations-mymaps-1yxCHhr_sgIHWJqjtbzGr8Gdx6JYuP3o-v1';
    function readAirportLocationCache() {
      try {
        const saved = JSON.parse(localStorage.getItem(AIRPORT_LOCATION_CACHE_KEY));
        if (!saved || saved.backend !== BACKEND_URL || !Array.isArray(saved.records) || !saved.records.length) return null;
        return saved;
      } catch (error) { return null; }
    }
    function displayAirportLocations(data, cached) {
      airportLayer.clearLayers(); airportLocations.clear(); airportMarkers.clear();
      if (selectedMarker) { airportMap.removeLayer(selectedMarker); selectedMarker = null; }
      (data.records || []).forEach(location => {
        if (!/^[A-Z]{4}$/.test(location.code) || !Number.isFinite(location.lat) || !Number.isFinite(location.lng) || Math.abs(location.lat) > 90 || Math.abs(location.lng) > 180) return;
        airportLocations.set(location.code, location); addAirportMarker(location);
      });
      $('mapStatus').textContent = '공항 ' + airportLocations.size.toLocaleString() + '개' + (cached ? ' · 최신 목록 확인 중' : '');
      if (selectedCode) focusAirport(selectedCode);
      else if (airportLocations.size) airportMap.fitBounds(Array.from(airportLocations.values(), p => [p.lat, p.lng]), { padding: [35, 35], maxZoom: 7 });
      updateMapLabels();
    }
    async function initializeAirportMap(refresh = false) {
      if (!window.L) { $('mapStatus').textContent = '지도를 불러오지 못했습니다. 공항코드 검색은 사용할 수 있습니다.'; $('mapStatus').className = 'map-status error'; return; }
      if (!airportMap) {
        airportMap = L.map('airportMap', { zoomControl: false, preferCanvas: true, worldCopyJump: true, minZoom: 2, maxZoom: 16 }).setView([24, 20], 2);
        L.layerGroup([
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Tiles © Esri' }),
          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Labels © Esri' })
        ]).addTo(airportMap);
        L.control.zoom({ position: 'bottomleft' }).addTo(airportMap);
        airportLayer = L.layerGroup().addTo(airportMap);
        airportMap.on('moveend', updateMapLabels);
      }
      const serial = ++airportLoadSerial;
      $('mapStatus').className = 'map-status';
      const saved = readAirportLocationCache();
      if (!airportLocations.size && saved) displayAirportLocations(saved, true);
      else $('mapStatus').textContent = airportLocations.size ? '공항 ' + airportLocations.size.toLocaleString() + '개 · 최신 목록 확인 중' : '공항 위치를 불러오는 중입니다…';
      try {
        const data = await transport.search({ source: 'airports', refresh: refresh === true });
        if (serial !== airportLoadSerial) return;
        // 이미 표시한 좌표가 같으면 지도 중심과 마커를 유지합니다.
        const records = data.records || [];
        const previous = Array.from(airportLocations.values());
        if (JSON.stringify(previous) !== JSON.stringify(records)) displayAirportLocations(data, false);
        else $('mapStatus').textContent = '공항 ' + airportLocations.size.toLocaleString() + '개';
        try { localStorage.setItem(AIRPORT_LOCATION_CACHE_KEY, JSON.stringify({ backend: BACKEND_URL, records, fetchedAt: data.fetchedAt, savedAt: Date.now() })); } catch (error) {}
      } catch (error) {
        if (serial !== airportLoadSerial) return;
        if (airportLocations.size) {
          $('mapStatus').textContent = '공항 ' + airportLocations.size.toLocaleString() + '개 · 저장된 목록 표시 중 (최신 목록 확인 실패)';
          return;
        }
        $('mapStatus').textContent = '공항 목록 조회 실패: ' + (error.message || '↻ 버튼으로 다시 시도하세요.');
        $('mapStatus').className = 'map-status error';
      }
    }
    function imagePreviewUrl(url) {
      const u = new URL(url);
      if (/\.(?:jpe?g|png|gif|webp|avif|bmp)$/i.test(u.pathname)) return u.href;
      if (u.hostname.endsWith('.googleusercontent.com') && /(?:^|\.)(?:lh\d+|blogger)\.googleusercontent\.com$/.test(u.hostname)) return u.href;
      return '';
    }
    function documentPreviewUrl(url) {
      const u = new URL(url);
      if (u.hostname === 'drive.google.com') {
        const pathId = u.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        const id = pathId ? pathId[1] : u.searchParams.get('id');
        if (id && /^[a-zA-Z0-9_-]+$/.test(id)) {
          const preview = new URL('https://drive.google.com/file/d/' + id + '/preview');
          const key = u.searchParams.get('resourcekey');
          if (key) preview.searchParams.set('resourcekey', key);
          return preview.href;
        }
      }
      return /\.pdf$/i.test(u.pathname) ? u.href : '';
    }
    function mediaTitle(text) {
      const lines = String(text || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      const title = lines.length ? lines[lines.length - 1] : '';
      return /^[\s)\].,;:!?]+$/.test(title) ? '' : title;
    }
    function richText(text) {
      const box = el('div', 'text');
      const value = String(text || '');
      const regex = /https?:\/\/[^\s<>"']+/gi;
      const previews = new Map();
      let offset = 0, match;
      while ((match = regex.exec(value))) {
        let href = match[0].replace(/[.,;!?]+$/, '');
        for (const pair of [['(', ')'], ['[', ']'], ['{', '}']]) {
          while (href.endsWith(pair[1]) && href.split(pair[1]).length > href.split(pair[0]).length) href = href.slice(0, -1);
        }
        box.append(el('span', '', value.slice(offset, match.index)));
        try {
          const u = new URL(href);
          if (!['https:', 'http:'].includes(u.protocol)) throw new Error('Unsupported URL');
          const a = el('a', 'inline-link', href); a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; box.append(a);
          const documentUrl = documentPreviewUrl(u.href), photo = imagePreviewUrl(u.href);
          const previewUrl = documentUrl || photo;
          if (previewUrl) {
            const title = mediaTitle(value.slice(offset, match.index));
            const existing = previews.get(previewUrl);
            if (!existing) previews.set(previewUrl, { kind: documentUrl ? 'document' : 'image', url: previewUrl, href: u.href, title });
            else if (!existing.title && title) existing.title = title;
          }
        } catch (error) { box.append(el('span', '', href)); }
        offset = match.index + href.length;
      }
      box.append(el('span', '', value.slice(offset)));
      previews.forEach(preview => {
        const figure = el('figure', 'media-preview');
        if (preview.title) figure.append(el('h4', 'media-title', preview.title));
        if (preview.kind === 'document') {
          const frame = el('iframe'); frame.src = preview.url; frame.title = preview.title || '문서 미리보기'; frame.loading = 'lazy';
          frame.setAttribute('allowfullscreen', ''); figure.append(frame); box.append(figure); return;
        }
        const a = el('a'); a.href = preview.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        const img = el('img'); img.src = preview.url; img.alt = '링크의 이미지 미리보기'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
        img.addEventListener('error', () => { a.remove(); figure.append(el('figcaption', '', '미리보기를 불러오지 못했습니다. 위 링크를 클릭해 확인하세요.')); }, { once: true });
        a.append(img); figure.append(a); box.append(figure);
      });
      return box;
    }
    function field(parent, label, text) { const n = el('div', 'field'); n.append(el('div', 'fieldlabel', label), richText(text)); parent.append(n); }
    function kst(value) { return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(value)) + ' KST'; }
    function submit(refresh) {
      const code = $('code').value.normalize('NFKC').trim().toUpperCase();
      if (!/^[A-Z]{4}$/.test(code)) { $('message').textContent = 'ICAO 공항코드 4자리를 입력하세요. 예: RKSS'; $('message').className = 'error'; $('code').focus(); return; }
      state.code = code; state.generation++; $('code').value = code; $('refresh').disabled = false;
      $('results').hidden = false; focusAirport(code);
      $('message').className = ''; $('message').textContent = '';
      load('map', 1, refresh); load('sheet', 1, refresh);
    }
    function load(source, page, refresh) {
      const generation = state.generation, serial = ++state[source].serial;
      const valid = () => generation === state.generation && serial === state[source].serial;
      const content = $(source + 'Content'); content.replaceChildren(el('div', 'loading', '자료를 불러오는 중입니다…'));
      $(source + 'Panel').setAttribute('aria-busy', 'true'); $(source + 'Count').textContent = ''; $(source + 'Pager').hidden = true;
      $(source + 'Meta').textContent = state.code + ' · 조회 중';
      const request = { source, code: state.code, page, refresh: !!refresh, aircraft: source === 'sheet' ? $('aircraft').value : '' };
      transport.search(request).then(result => { if (valid()) { render(source, result); if (source === 'map' && refresh) initializeAirportMap(); } })
        .catch(error => {
          if (!valid()) return;
          $(source + 'Panel').setAttribute('aria-busy', 'false');
          $(source + 'Meta').textContent = state.code + ' · 조회 실패';
          const box = el('div', 'errorbox', error.message || '자료를 불러오지 못했습니다.');
          const retry = el('button', '', '다시 시도'); retry.type = 'button'; retry.addEventListener('click', () => load(source, page, true)); box.append(retry); content.replaceChildren(box);
        });
    }
    function render(source, data) {
      $(source + 'Panel').setAttribute('aria-busy', 'false'); $(source + 'Count').textContent = data.total + '건';
      if (source === 'map' && !airportLocations.has(data.code)) {
        const located = data.records.find(record => record.coordinates);
        if (located) {
          const location = { code: data.code, title: located.title, lat: located.coordinates.lat, lng: located.coordinates.lng };
          airportLocations.set(data.code, location); addAirportMarker(location); focusAirport(data.code);
        }
      }
      $(source + 'Meta').textContent = data.code + ' · 조회 ' + kst(data.fetchedAt) + (data.stored ? ' · 저장된 공항정보' : (data.cached ? ' · 최대 5분 캐시' : ' · 원본 조회'));
      const content = $(source + 'Content'); content.replaceChildren();
      if (data.warnings && data.warnings.length) content.append(el('div', 'warning', data.warnings.join('\n')));
      if (!data.records.length) content.append(el('div', 'empty', '해당 공항의 자료가 없습니다.'));
      data.records.forEach(record => {
        const article = el('article', 'record');
        if (source === 'map') {
          article.append(el('h3', '', record.title));
          if (record.description) article.append(richText(record.description));
          (record.fields || []).forEach(f => { if (!(f.label.toLowerCase() === 'description' && f.value === record.description)) field(article, f.label, f.value); });
          if (!record.description && !(record.fields || []).length) article.append(el('div', 'text', '저장된 설명이 없습니다.'));
          if (record.coordinates) field(article, '좌표', record.coordinates.lat + ', ' + record.coordinates.lng);
        } else {
          article.append(el('h3', '', (record.date || '날짜 정보 없음') + ' · ' + record.aircraft));
          const meta = el('div', 'recordmeta'); meta.append(el('span', 'badge', record.sheetName), el('span', '', record.title), el('span', '', record.rowNumber + '행')); article.append(meta);
          if (record.memo) article.append(richText(record.memo));
          else article.append(el('div', 'text', '저장된 운항 메모가 없습니다. 전체 행에서 기록을 확인하세요.'));
          const details = el('details'); details.append(el('summary', '', '운항 메모 외 행 데이터 보기 (' + record.fields.length + '개 항목)'));
          record.fields.forEach(f => field(details, f.label, f.value)); article.append(details);
        }
        content.append(article);
      });
      const pager = $(source + 'Pager'); pager.replaceChildren(); pager.hidden = data.pages <= 1;
      if (data.pages > 1) {
        const previous = el('button', '', '이전'); previous.type = 'button'; previous.disabled = data.page <= 1; previous.onclick = () => load(source, data.page - 1, false);
        const next = el('button', '', '다음'); next.type = 'button'; next.disabled = data.page >= data.pages; next.onclick = () => load(source, data.page + 1, false);
        pager.append(previous, el('span', '', data.page + ' / ' + data.pages), next);
      }
    }
    $('mapReload').addEventListener('click', () => initializeAirportMap(true));
    initializeAirportMap();
    $('searchForm').addEventListener('submit', e => { e.preventDefault(); submit(false); });
    $('refresh').addEventListener('click', () => submit(true));
    $('aircraft').addEventListener('change', () => { if (state.code) load('sheet', 1, false); });
    document.querySelectorAll('[data-code]').forEach(button => button.addEventListener('click', () => { $('code').value = button.dataset.code; submit(false); }));
  </script>
</body>
</html>
